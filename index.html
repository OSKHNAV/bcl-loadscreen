<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>BRASIL CARIOCA LIFE - Loading</title>
<style>
  @import url('https://googleapis.com');

  :root {
    --blue: #00b4ff;
    --white: #e8f4ff;
    --black: #000000;
    --glow: 0 0 10px #00b4ff, 0 0 30px #00b4ff55;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    width: 100vw; height: 100vh;
    overflow: hidden;
    font-family: 'Share Tech Mono', monospace;
    display: flex; align-items: center; justify-content: center;
  }

  /* Efeitos de Scanlines */
  body::before {
    content: '';
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px);
    pointer-events: none; z-index: 100;
    animation: scanmove 8s linear infinite;
  }
  @keyframes scanmove { 0% { background-position: 0 0; } 100% { background-position: 0 100px; } }

  .container { text-align: center; position: relative; z-index: 10; }

  .logo-img { width: 450px; margin-bottom: 15px; filter: drop-shadow(0 0 8px var(--blue)); }

  .title {
    font-family: 'Orbitron', monospace;
    font-size: 3.2rem;
    font-weight: 900;
    color: var(--white);
    letter-spacing: 6px;
    text-transform: uppercase;
    animation: glitch 3s infinite;
    position: relative;
  }

  .subtitle { color: var(--blue); font-size: 1rem; letter-spacing: 12px; margin-top: 8px; text-shadow: var(--glow); }

  .divider {
    width: 400px;
    margin: 30px auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .divider span {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: var(--glow);
    animation: dotpulse 1.4s infinite ease-in-out;
    display: inline-block;
  }
  .divider span:nth-child(1) { animation-delay: 0s; }
  .divider span:nth-child(2) { animation-delay: 0.2s; }
  .divider span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotpulse {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1.3); box-shadow: 0 0 14px #00b4ff, 0 0 40px #00b4ff88; }
  }

  .progress-wrap { width: 400px; height: 4px; background: rgba(0,180,255,0.1); border: 1px solid rgba(0,180,255,0.3); margin: 0 auto; position: relative; overflow: hidden; }
  .progress-bar { height: 100%; width: 0; background: var(--blue); box-shadow: var(--glow); animation: load 6s ease-in-out forwards; }
  @keyframes load { 0%{width:0} 100%{width:100%} }

  .status { color: rgba(0,180,255,0.7); font-size: 0.75rem; letter-spacing: 4px; margin-top: 16px; }

  /* Botão de Áudio Estilizado */
  .audio-control {
    position: fixed;
    bottom: 30px;
    right: 30px;
    background: rgba(0, 180, 255, 0.1);
    border: 1px solid var(--blue);
    color: var(--blue);
    padding: 10px 20px;
    font-family: 'Share Tech Mono', monospace;
    cursor: pointer;
    z-index: 1000;
    transition: 0.3s;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: var(--glow);
  }
  .audio-control:hover { background: var(--blue); color: var(--black); }

  .corner { position: fixed; width: 40px; height: 40px; border-color: var(--blue); border-style: solid; opacity: 0.6; }
  .corner.tl { top: 20px; left: 20px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 20px; right: 20px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 20px; left: 20px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 20px; right: 20px; border-width: 0 2px 2px 0; }

  /* Botão Continuar */
  .skip-btn {
    position: fixed;
    bottom: 30px;
    left: 30px;
    background: rgba(0, 180, 255, 0.1);
    border: 1px solid var(--blue);
    color: var(--blue);
    padding: 10px 20px;
    font-family: 'Share Tech Mono', monospace;
    cursor: pointer;
    z-index: 1000;
    transition: 0.3s;
    text-transform: uppercase;
    letter-spacing: 2px;
    box-shadow: var(--glow);
    opacity: 0;
    pointer-events: none;
    animation: fadeInBtn 0.8s ease forwards;
    animation-delay: 4s;
  }
  .skip-btn:hover { background: var(--blue); color: var(--black); }
  @keyframes fadeInBtn {
    0%   { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0px); }
  }
  .skip-note {
    position: fixed;
    bottom: 14px;
    left: 30px;
    color: rgba(0,180,255,0.4);
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeInBtn 0.8s ease forwards;
    animation-delay: 4s;
  }
</style>
</head>
<body>
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <button id="musicBtn" class="audio-control">Musica: ON</button>
  <button id="skipBtn" class="skip-btn">► Continuar para Área de Drift</button>


  <div class="container">
    <img src="bcllogo.png" alt="BCL Logo" class="logo-img">
    <div class="title" data-text="BRASIL CARIOCA LIFE">BRASIL CARIOCA LIFE</div>
    <div class="subtitle">◈ ROLEPLAY ◈</div>
    <div class="divider"><span></span><span></span><span></span></div>
    <div class="progress-wrap">
      <div class="progress-bar"></div>
    </div>
    <div class="status">---> BAIXANDO MODS <---</div>
  </div>

  <audio id="bgMusic" src="music.mp3" loop autoplay></audio>

  <script>
    const audio = document.getElementById('bgMusic');
    const btn = document.getElementById('musicBtn');
    
    audio.volume = 0.015; // Volume inicial em 30%

    function toggleMusic() {
      if (audio.paused) {
        audio.play();
        btn.innerText = "Musica: ON";
      } else {
        audio.pause();
        btn.innerText = "Musica: OFF";
      }
    }

    // Tenta tocar automaticamente ao carregar
    window.addEventListener('load', () => {
      audio.play().catch(() => {
        console.log("Autoplay bloqueado pelo navegador. Aguardando interação.");
      });
    });

    // Garante que toque no primeiro clique do jogador na tela
    document.addEventListener('click', () => {
      if (audio.paused && btn.innerText === "Musica: ON") {
        audio.play();
      }
    }, { once: true });

    btn.addEventListener('click', (e) => {
      e.stopPropagation(); // Evita que o clique no botão ative o evento do document
      toggleMusic();
    });

    // Botão Continuar — habilita pointer-events após o delay da animação
    const skipBtn = document.getElementById('skipBtn');
    setTimeout(() => {
      skipBtn.style.pointerEvents = 'all';
    }, 4800);

    skipBtn.addEventListener('click', (e) => {
      e.stopPropagation();

      mta.triggerEvent('onSkipLoadscreen');
    });
  </script>
</body>
</html>
